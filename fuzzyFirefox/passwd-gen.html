<!-- Generated by AI and then modified -->
<!doctype html>
<html lang="en">
<head>
	<title>Password Generator</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<style>
/*Style and layout was generated by AI*/
    :root{
      --bg: #ffffff;
      --card: rgba(0,0,0,.02);
      --text: #0b0c0f;
      --muted:#5b6476;
      --line: rgba(0,0,0,.10);
      --accent:#5b5cff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --radius:16px;
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0c0f;
        --card: rgba(255,255,255,.03);
        --text:#e9edf4;
        --muted:#9aa3b2;
        --line: rgba(255,255,255,.12);
        --accent:#7c5cff;
      }
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:var(--sans);
      background: var(--bg);
      color:var(--text);
      padding:28px 16px;
      font-size: 1rem;
    }

    .wrap{
      max-width:860px;
      margin:0 auto;
    }

    header{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    h1{
      font-size:1.2rem;
      letter-spacing:.2px;
      margin:0;
      font-weight:650;
    }

    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      backdrop-filter: blur(8px);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    @media (min-width: 820px){
      .grid.two{ grid-template-columns: 1fr 1fr; }
    }

    label{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size: 0.8rem;
      margin-bottom:6px;
    }

    .field{ display:flex; flex-direction:column; }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .mono{
      font-family:var(--mono);
      font-size:1rem;
      letter-spacing:.2px;
    }

    input[type="file"]{ padding:10px 0; color:var(--muted); border:none; background:transparent; }

    input, select{
      appearance:none;
      width:100%;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background: transparent;
      color:var(--text);
      outline:none;
      font: inherit;
    }

    input.mono{ padding:10px 12px; }

    input:focus, select:focus{
      border-color: rgba(124,92,255,.55);
      box-shadow: 0 0 0 3px rgba(124,92,255,.20);
    }

    .out{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background: transparent;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      user-select:text;
    }

    button{
      border:1px solid var(--line);
      background: transparent;
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      transition: border-color .2s ease, background .2s ease;
      white-space:nowrap;
    }

    button:hover{
      border-color: rgba(124,92,255,.40);
      background: rgba(124,92,255,.10);
    }

    button:active{ transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Passwd generator</h1>
    </header>

    <div class="card">
      <div class="grid two">
        <div class="field">
          <label for="fileInput">
            <span>Base key</span>
            <span class="mono" id="fileOutput">....</span>
          </label>
          <input id="fileInput" type="file" onchange="fileChecksum()" />
        </div>

        <div class="field">
          <label for="show">
            <span>Format</span>
            <span class="mono" style="color:var(--muted)">output</span>
          </label>
          <select id="show" onchange="pwdChecksum()">
            <option value="UUID" selected>UUID</option>
            <option value="RAW">Raw(Cut)</option>
            <option value="B64">Base64</option>
            <option value="PASS">Password</option>
          </select>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="grid">
        <div class="field">
          <label for="pwdInput">
            <span>Value</span>
          </label>

          <div class="row">
            <input id="pwdInput" class="mono" type="input" oninput="pwdChecksum()" placeholder="Type here..." />
            <button id="toClipboard" onclick="toClipboard()">To clipboard</button>
          </div>

          <div style="height:10px"></div>

	  <div class="row">
            <input type="password" readonly class="out mono" id="pwdOutput" aria-label="Generated output">
            <button id="toggleShow" onclick="toggleShowing()">Show</button>
	  </div>
        </div>
      </div>

    </div>
  </div>


	<script>
const hashAlg = "SHA-256";
const fileInput  = document.getElementById('fileInput' );
const fileOutput = document.getElementById('fileOutput');
const showAlgo   = document.getElementById('show'      );
const pwdInput   = document.getElementById('pwdInput'  );
const pwdOutput  = document.getElementById('pwdOutput' );
const toggleShow = document.getElementById('toggleShow');

function bufToUuid(buffer){
	let template ='(xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx)';
	let bhex = bufToHex(buffer);
	let idx = 0;
	let outp = "";
	for(const c of template){
		if("()-4".indexOf(c) != -1){
			outp += c;
			continue;
		}
		let v = parseInt(bhex[idx],16);
		let inv = (15 - v).toString(16);
		if(c == 'X') outp += inv;
		if(c == 'Z') outp += inv;
		if(c == 'x') outp += bhex[idx];
		if(c == 'z') outp += bhex[idx];
		if(c == 'y'){
			outp += (8 | (v & 3)).toString(16);
		}
		//
		if(c.toLowerCase() == 'z')
			idx += 2;
		else idx++;
	}
	return outp;
}
function bufToBase64(buffer){
	bu8 = new Uint8Array(buffer);
	return bu8.toBase64();
}
function bufToPasswd(buffer){
	const limit = 20;
	let filled = 0;
	const bytes = new Uint8Array(buffer);
	let outp = '';
	for (let i = 0; i < bytes.length && filled < limit; i++) {
		let v = bytes[i] & 0x7f;
		if(v <= 0x20)continue;
		if(v >= 0x7f)continue;
		if(v == 0x60)continue;
		outp += String.fromCharCode(v);
		filled++;
	}
	return outp;
}
// Converts an ArrayBuffer to a hex string
function bufToHex(buffer) {
	const bytes = new Uint8Array(buffer);
	let hex = '';
	for (let i = 0; i < bytes.length; i++) {
		hex += bytes[i].toString(16).padStart(2, '0');
	}
	return hex;
}

function getShowAlgo(){
	if(showAlgo.value == "UUID")return bufToUuid;
	if(showAlgo.value == "RAW" )return bufToHex;
	if(showAlgo.value == "B64" )return bufToBase64;
	if(showAlgo.value == "PASS")return bufToPasswd;
	return bufToUuid;
}
async function fileChecksum() {
	fileOutput.textContent = '....';
	const file = fileInput.files && fileInput.files[0];
	if (!file) { fileOutput.textContent = '....'; return; }
	const arrayBuffer = await file.arrayBuffer();
	const digest = await crypto.subtle.digest(hashAlg, arrayBuffer);
	let oval = bufToHex(digest).slice(0,8);
	//if(size > 0)oval = oval.slice(0,size);
	fileOutput.textContent = oval;
	pwdChecksum();
}
const textEnc = new TextEncoder();
function concatTypedArrays(a, b) { // a, b TypedArray of same type
	var c = new (a.constructor)(a.length + 1 + b.length);
	c.set(a, 0);
	c[a.length] = 255;
	c.set(b, a.length + 1);
	return c;
}
async function pwdChecksum() {
	pwdOutput.value = '....';
	const textBuffer = textEnc.encode(pwdInput.value);
	const file = fileInput.files && fileInput.files[0];
	if (!file) { pwdOutput.value = '....'; return; }
	const arrayBuffer = await file.bytes();
	const concBuffer = concatTypedArrays(textBuffer,arrayBuffer);

	const digest = await crypto.subtle.digest(hashAlg, concBuffer);
	let oval = getShowAlgo()(digest).slice(0,44);
	pwdOutput.value = oval;
}
function toClipboard(){
	navigator.clipboard.writeText(pwdOutput.value);
}
function toggleShowing(){
	const isHide = pwdOutput.type == "password";
	if(isHide){
		pwdOutput.type = "output";
		toggleShow.textContent = "Hide";
	}else{
		pwdOutput.type = "password";
		toggleShow.textContent = "Show";
	}
}
setTimeout(() => fileChecksum(),0);
	</script>
	<script>
if(!Uint8Array.prototype.toBase64){
	Uint8Array.prototype.toBase64 = function () {
		let binary = '';
		const bytes = this;
		const len = bytes.byteLength;
		for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
		return btoa(binary);
	};
}
	</script>

</body>
</html>
